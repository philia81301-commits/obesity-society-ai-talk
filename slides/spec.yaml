schema_version: "html_slide_deck_v1"

deck:
  title: "人工智慧在肥胖治療運用的新發展"
  presenter: "潘湘如 醫師｜高雄榮民總醫院家庭醫學部"
  audience: "醫護人員（台灣肥胖醫學會 2026 南區學術研討會會員）"
  language: "zh-TW"
  project_slug: "obesity-ai-talk"
  slide_count: 50

design_system:
  # 本場為醫學會學術演講，覆寫 SKILL.md 預設的深色霓虹科技風，
  # 改用先前已與使用者確認的「學術沉穩風：白底墨綠」
  palette:
    accent: "#1B4332"      # 主色：墨綠（標題／強調／大數字）
    accent2: "#52796F"     # 次色：灰綠（輔助元素、連結、圖標）
    success: "#8A9A5B"     # 正向數據強調（橄欖金綠，如成效%、正面案例）
    warn: "#B5651D"        # 風險／警示強調（赭紅棕，僅第三段資安落地挑戰使用）
  # 2026-08-14 修訂：使用者反映「單色配色單調、易疲勞」，改為板塊識別色制。
  # 同一調性不同色相，翻到新板塊時眼睛能辨識換段；實作上由 index.html 頁尾
  # script 依 data-slide 自動指派 data-sec，各元件一律吃 --sec 而非寫死顏色。
  section_palette:
    intro_and_part1: "#1B4332"   # 前言 P1-3 ＋ Ⅰ發展脈絡 P4-17：墨綠
    part2: "#1D5A6C"             # Ⅱ現況實務 P18-38：深青藍（最長一段，換色降低疲勞）
    part3: "#8C4A2F"             # Ⅲ落地挑戰 P39-47：赭棕（風險語境）
    closing: "#5C6B3C"           # 結語與展望 P48-50：橄欖
  # 各板塊色以 CSS color-mix() 自動衍生 tint(7%)／soft(22%)／line(35%) 三階，
  # 卡片與引用框改用 tint 底色，解決「整片全白」的單調感。
  background: "#FFFFFF"        # 主背景：純白
  background_alt: "#F6F5F0"    # 章節分隔頁備用：暖米白
  text_primary: "#22303C"      # 內文深炭灰（非純黑）
  text_secondary: "#5B6B63"    # 次要文字：灰綠
  fonts:
    heading: "Noto Serif TC"        # 標題：思源宋體，學術權威感
    body: "Noto Sans TC"            # 內文：思源黑體，清晰易讀
    stat_number: "Noto Sans TC"     # 大數字統計卡：思源黑體 Black/900，不另外引入字型
  layout_note: >
    16:9，版面留白寬鬆（不做滿版設計）；標題下方一律加一條墨綠細線；
    左上角小字標示板塊羅馬數字（Ⅰ／Ⅱ／Ⅲ）；頁尾放頁碼＋講題簡稱。
    案例頁（P19-34）採「左側案例編號色塊＋右側內容」的一致子版型。
    P36 時程佐證頁採「大數字卡片」自訂版型（非 schema 標準 tag）：
    4 張卡片橫列，每張上方超大墨綠數字＋下方小字說明，比照
    material-inventory.md 的「18天／當天／跨一夜／13分鐘」四筆真實數據。
  bg_style_note: >
    SKILL.md 預設的 BG prompt（深藍霓虹發光）不適用本場學術主題，
    以下所有 BG 頁的 prompt_direction 已改寫為「淺色紙感背景＋極淡墨綠線稿」，
    opacity 建議壓低至 0.08-0.15（遠低於 SKILL.md 預設的 0.3-0.4），
    避免與白底黑字的學術版面衝突。
  citation_note: >
    P39-47（Ⅲ落地挑戰段）內容整理自成功大學計算機與網路中心李南逸主任
    《AI時代之醫療隱私與個資保護挑戰》講義（見 reference/ai-privacy-security-notes.md）。
    Phase 2 生成 HTML 時，P39 與 P47 需在頁面可見處（建議頁尾小字或內文最後一行）
    明確顯示「資料來源：成功大學計算機與網路中心 李南逸主任《AI時代之醫療隱私與
    個資保護挑戰》講義」字樣，不能只放在講者備忘稿。
  icon_system: >
    2026-08-14 決策：圖標改用「內嵌 SVG 線性圖標」，不使用 draw 技能的 AI 生圖。
    理由：向量不失真、stroke 顏色可跟著板塊色 --sec 自動變化、離線零依賴，
    且不受 AI 生圖風格漂移影響（本專案先前 BG 底圖已連續 4 版未過關）。
    17 個 symbol 定義於 index.html body 開頭的 <svg> sprite，
    用法 <svg class="ic"><use href="#ic-xxx"/></svg>。
    涵蓋 P4／P18／P37／P41／P45 五個 ICON 頁，共 25 處引用。
  dataviz_note: >
    2026-08-14 新增：使用者反映「缺乏視覺化」，將純條列頁改為圖表。
    已完成 P3（四板塊流程圖）、P5（前五因子橫條圖）、P6（代謝表型堆疊條）、
    P16／P48（三階段推進圖）、P24（月報自動化流程圖）。
    ⚠️ P5 橫條長度僅代表原研究的排序 1-5，非重要度數值（原文未提供效果量），
    此限制已標示於該頁 .cite 區塊，不可移除。
  bg_decision: >
    2026-08-14 決策（分兩類處理）：
    (A) 減重門診三工具 P19／P21／P24 —— 使用者要求「風格強烈底圖」，已用 draw 技能
    （gpt-image-2, low, 各 NT$0.3）生成手繪粗筆觸插畫，深青藍＋暖橘配色呼應 Ⅱ 板塊識別色，
    主體置於畫面右三分之一、左側大量留白。opacity 不壓（維持強烈）。
    對應內容頁 P20／P22／P23／P25／P26／P27 沿用同款圖但 opacity 0.08-0.1，維持風格連貫。
    ⚠️ 掛強烈底圖的頁面，內容需套 .has-bg（限寬 63%）避免文字壓到右側插畫。
    檔案：images/p19_form_bg_20260814_230152.png（golden sample，風格基準）、
    p21_rag_bg_20260814_231128.png、p24_report_bg_20260814_231727.png
    (B) 其餘板塊開篇頁 —— 維持純 CSS 暖米白（data-background-color="#F6F5F0"），
    不掛 AI 底圖；HTML 內保留 <!-- [BG] --> 註解位置，日後要加可直接替換。
  dataviz_round2: >
    2026-08-14 第二輪（使用者回饋「壅擠、沒特色、配色單調」後）：
    新增 .split（左數字卡＋右圖表）、.cmp（兩數對比）、.chain（推演鏈）、
    .key-box（深色反白結論塊，全檔 15 處）四種版式。
    已改：P5（前五因子，可介入因子以 --pop 高亮）、P6（堆疊條改為代謝健康 vs 異常語意配色
    ＋44/56 標尺）、P7（三數字卡以顏色呈現「行為改變大、體重僅減 1kg」的落差）、
    P8（Warwick 450 人拉為數字卡）、P12（兩組 GRS／DecScore 對比數字）、
    P14（三產品卡）、P42-44（三個個資案例統一為「公開資料→反推手法→還原結果」推演鏈）。
    核心原則：**顏色必須承載語意**，不是裝飾。
    版面守則：內容高度不超過可用區 90%（648px），超過即視為壅擠需精簡。
  style_reference: null

slides:
  - id: 1
    title: "標題頁"
    summary: "講題「人工智慧在肥胖治療運用的新發展」、潘湘如醫師、高雄榮民總醫院家庭醫學部、台灣肥胖醫學會2026南區學術研討會、2026-09-20。"
    tags: ["BG"]
    bg:
      prompt_direction: "soft off-white paper-textured background, extremely faint deep forest-green ink-line abstract medical data motif suggesting a subtle line chart and molecular network, generous negative space, minimal editorial academic illustration, no text, no glow, no neon"
      opacity: 0.12

  - id: 2
    title: "為什麼現在要談這個"
    summary: "肥胖照護負擔持續上升，與AI技術快速演進在此刻交會；開場以文字雲收集聽眾對「AI在減重門診最能發揮的環節」的第一印象。"
    tags: ["INTERACT:wordcloud"]
    interact:
      type: "wordcloud"

  - id: 3
    title: "今日架構"
    summary: "四段式地圖：發展脈絡（過去到現在）→ 臨床導入現況（四個實務案例）→ 落地挑戰（資安與個資）→ 結語與展望。"
    tags: []

  - id: 4
    title: "AI 於肥胖醫學應用的分析框架"
    summary: "以「診斷／管理／研究」三面向作為全場回顧的分類骨架，沿用2024/2025素材架構。板塊Ⅰ開篇，掛BG標示進入新板塊。"
    tags: ["BG", "ICON"]
    bg:
      prompt_direction: "pale off-white background, faint deep green ink-line motif of a timeline or ascending curve suggesting research development over time, minimal academic editorial style, no text, no glow"
      opacity: 0.12
    icon:
      items:
        - "icon_diagnosis：診斷－風險預測、代謝表型分群"
        - "icon_management：管理－穿戴裝置與數位行為介入"
        - "icon_research：研究－GLP-1與AI結合的精準醫療"

  - id: 5
    title: "過去：AI輔助診斷與風險分層（一）"
    summary: "2018-2022奠基期——兒童肥胖預測模型的早期研究，AI如何從人口學與生理指標預測未來肥胖風險。"
    tags: []

  - id: 6
    title: "過去：AI輔助診斷與風險分層（二）"
    summary: "2018-2022奠基期——代謝表型分群研究，AI如何從異質的肥胖族群中辨識具臨床意義的亞型。"
    tags: []

  - id: 7
    title: "中期：穿戴裝置與數位行為介入（一）"
    summary: "2022-2024驗證期——穿戴裝置實證累積的統合分析，數位監測工具在體重管理的證據等級演進。"
    tags: []

  - id: 8
    title: "中期：穿戴裝置與數位行為介入（二）"
    summary: "2022-2024驗證期——自我監控成效研究，數位行為介入對減重維持的實證證據。"
    tags: []

  - id: 9
    title: "政策與產業採用現況"
    summary: "台灣衛福政策白皮書對智慧照護的規劃方向，以及智慧照護採用率調查數字。"
    tags: []

  - id: 10
    title: "消費端平台的 AI 產品化（一）：Noom"
    summary: "Noom的技術路線——以心理行為驅動模型為核心的AI體重管理設計。"
    tags: []

  - id: 11
    title: "消費端平台的 AI 產品化（二）：WeightWatchers"
    summary: "WeightWatchers的技術路線——臨床整合模型，與Noom的心理驅動路線對比。"
    tags: []

  - id: 12
    title: "現在：GLP-1藥物與AI結合的進展（一）"
    summary: "Mayo Clinic／Phenomix GRS研究（liraglutide，n=110，噁心副作用比例68% vs 30%，會議摘要層級）；TiP DecScore：<55歲亞組中用藥符合AI建議者HbA1c控制率64.1% vs不符合者46.2%。"
    tags: []

  - id: 13
    title: "現在：GLP-1藥物與AI結合的進展（二）"
    summary: "AI參與度對藥物成效的影響（JMIR 2026 e83718：tirzepatide第12月，engaged -22.89% vs non-engaged -17.55%）；市場規模引用DelveInsight $38.5B（限定主要市場，非全球）。"
    tags: []

  - id: 14
    title: "新興方向：Agentic AI在肥胖照護"
    summary: "MediKarma「Diabetes & Obesity Jill」MAU 35%、HealthVerity eXOs（廠商自評零幻覺）；WeGoTogether成效-20.4%／-50.5%，須揭露24個月時樣本僅325人（存活者偏誤）。"
    tags: []

  - id: 15
    title: "產業模式演變"
    summary: "從賣藥到資源配置決策引擎——支付端與雇主端如何運用AI重新設計肥胖照護的商業模式。"
    tags: []

  - id: 16
    title: "小結：三個發展階段的共同軌跡"
    summary: "回顧奠基期、驗證期、精準醫療期三階段，共同軌跡是從理論驗證走向臨床可操作工具；收斂「過去到現在」的關鍵轉折點，銜接下一段的臨床實務導入現況。"
    tags: []

  - id: 17
    title: "過渡頁：從文獻回顧到臨床實務導入現況"
    summary: "承轉頁，從第一段的學術回顧過渡到第二段的實際臨床工作導入案例。"
    tags: ["BG"]
    bg:
      prompt_direction: "pale ivory background, faint ink-wash deep green horizon line suggesting a path transitioning from left to right, minimal abstract academic style, no text, no glow"
      opacity: 0.1

  - id: 18
    title: "本節架構：減重生態系為主線，其餘門診工具為輔"
    summary: "現況實務案例以減重門診工具為主線——資料蒐集自動化→AI病人溝通→AI資料分析，三者構成完整生態系；骨鬆、肌少症篩檢工具作為方法論可複製性的輔線佐證。本節案例含兩層「AI」意義：部分工具本身運用AI技術（如RAG），所有工具則都由AI agent輔助開發完成——這是「AI導入臨床工作」的兩種不同層次，會分開講清楚。板塊Ⅱ開篇，掛BG標示進入新板塊。"
    tags: ["BG", "ICON"]
    bg:
      prompt_direction: "pale off-white background, faint deep green ink-line motif of three interconnected nodes forming a small workflow loop, minimal academic editorial style, no text, no glow"
      opacity: 0.12
    icon:
      items:
        - "icon_collect：資料蒐集自動化－減重評估表單"
        - "icon_communicate：AI病人溝通－門診AI管理系統(RAG)"
        - "icon_analyze：AI資料分析－減重門診月度分析自動化"

  - id: 19
    title: "減重評估表單（一）雙軌資料蒐集設計"
    summary: "病人可初診前線上填寫Google表單（單一區段設計解決舊版問卷跳題斷資料的問題）；醫師看診時也可用「減重門診輸入工具」下拉選單快速輸入，兩者資料寫入同一份回覆試算表。工具本身是純表單＋樣板拼接，不含AI技術，但由AI agent輔助開發、當天上線。子案例開篇，掛BG標示切入新工具。"
    tags: ["BG"]
    bg:
      prompt_direction: "pale off-white background, faint deep green ink-line motif of a simple form or clipboard icon rendered abstractly, minimal academic editorial style, no text, no glow"
      opacity: 0.12

  - id: 20
    title: "減重評估表單（二）自動產生病歷貼稿＋驅動下游"
    summary: "醫師輸入工具一鍵「產生病歷文字」，把下拉選單資料組成可直接貼病歷系統的結構化貼稿（樣板拼接，非AI生成），同時背景送出同一筆到Google表單，免去雙重輸入；結構化回覆是後續AI管理系統與月度分析自動化共同的資料基礎建設。"
    tags: []

  - id: 21
    title: "AI管理系統（一）問題背景與RAG設計"
    summary: "臨床決策輔助與病人溝通案例——門診AI管理系統的設計動機、RAG架構如何接上院內資料庫。子案例開篇，掛BG標示切入新工具。"
    tags: ["BG"]
    bg:
      prompt_direction: "pale off-white background, faint deep green ink-line motif of a speech bubble connected to a small database cylinder, minimal academic editorial style, no text, no glow"
      opacity: 0.12

  - id: 22
    title: "AI管理系統（二）RAG架構降低幻覺風險"
    summary: "以滑桿對比呈現：無RAG的一般對話式AI（籠統作答、可能編造衛教資訊）vs 有RAG接院內資料庫（先檢索再作答、附實際資料來源）。"
    tags: ["VIZ"]
    viz:
      left_label: "無 RAG（一般對話式AI）"
      right_label: "有 RAG（接院內資料庫）"
      left_items:
        - "憑訓練資料籠統作答"
        - "可能編造不存在的衛教資訊（幻覺）"
        - "無法引用院內實際數據"
      right_items:
        - "先檢索院內資料庫再作答"
        - "回答附實際資料來源"
        - "敏感問題自動轉介真人"

  - id: 23
    title: "AI管理系統（三）完整流程與敏感問題轉介"
    summary: >
      2026-08-14 補實：知識庫組成經使用者確認為「衛教單張＋治療指引」兩類院內既有文件
      （不需為導入 AI 另外編寫內容，是快速上線的原因，此點寫在 P21）。
      本頁改為四步驟流程圖：病人提問 → 檢索知識庫 → 生成回答（附資料來源）→ 敏感議題轉介真人，
      末格以 --pop 色標示轉介，強調「明確劃出 AI 不該回答的範圍」才是關鍵設計。
      ⚠️ 仍待補：敏感議題的實際判定範圍、應用成效觀察（無量化數據則以質性描述，不得硬湊百分比）。
    tags: []

  - id: 24
    title: "月度分析自動化（一）流程總覽"
    summary: "行政與資料分析效率化案例——從Google Drive原始資料（含P19-20的評估表回覆），經統計腳本分析，自動產出HTML／PPTX／DOCX三種格式報告的完整流程。子案例開篇（本場一大亮點），掛BG標示切入新工具。"
    tags: ["BG"]
    bg:
      prompt_direction: "pale off-white background, faint deep green ink-line motif of a cloud connected to three small document outlines, minimal academic editorial style, no text, no glow"
      opacity: 0.12

  - id: 25
    title: "月度分析自動化（二）定期檢視成效——一大亮點"
    summary: "每月固定執行的月度比較：新增個案特徵、藥物成效趨勢、未回診率雙軌口徑，讓門診經營成效不再只靠年度回顧，而能逐月追蹤。"
    tags: []

  - id: 26
    title: "月度分析自動化（三）雲端發布與時程佐證"
    summary: "全流程18天從動手到上線，並自動發布至GitHub Pages、OneDrive、Google Drive三處雲端，每月固定執行一次。"
